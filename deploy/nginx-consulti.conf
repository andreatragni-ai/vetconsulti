# /etc/nginx/sites-available/consulti  (symlink in sites-enabled/)
#
# Le direttive limit_req_zone stanno nel blocco http di nginx.conf (sono
# condivise con gli altri vhost del server): se non ci sono ancora,
# aggiungerle li' — vedi INSTALLAZIONE.md.

server {
    server_name consulti.vetway.it;

    # Clip eco e Holter grezzi: il limite vero e' UPLOAD_MAX_BYTE in Django,
    # qui basta che i singoli pezzi (4 MB) e i PDF passino.
    client_max_body_size 60M;

    # Staging non pubblicizzata: i motori di ricerca non la indicizzano.
    # Da togliere il giorno che il portale apre davvero.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Niente limit_req zone=vw_upload qui (VetCardio lo usa): la map in
    # nginx.conf lo accende su ogni URL con «upload», e un'eco intera caricata
    # a pezzi da 4 MB supera i 60 al minuto -> 429 a meta' caricamento.

    # Scan bot (shell PHP, WordPress, .env): chiusi qui, non arrivano a Django.
    location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-login|xmlrpc|\.env|\.git|actuator) { access_log off; return 444; }

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/consulti/app/staticfiles/;
        add_header Cache-Control "public, max-age=604800";
    }

    # File caricati: MAI serviti direttamente. Django decide chi puo' e
    # risponde con X-Accel-Redirect verso questo prefisso, che e' `internal`
    # (una richiesta diretta da fuori riceve 404).
    location /_media_interno/ {
        internal;
        alias /home/consulti/app/media/;
    }

    # Login e recupero password: rate limit per IP (zone in nginx.conf).
    location = /accedi/ {
        limit_req zone=vw_login burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-consulti.sock;
    }
    location /password/reset/ {
        limit_req zone=vw_reset burst=5 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-consulti.sock;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-consulti.sock;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/consulti.vetway.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/consulti.vetway.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = consulti.vetway.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name consulti.vetway.it;
    return 404; # managed by Certbot
}
